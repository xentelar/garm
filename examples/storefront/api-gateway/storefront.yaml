openapi: 3.1.0

info:
  title: E-commerce API
  version: 1.0.0
  description: |
    This is an e-commerce API spec example for a storefront. 
    It includes authentication, product browsing, cart, and checkout operations.
    Auth is token-based. Explore, test, and mock this API freely.
  license:
    name: Apache License, Version 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0'

servers:
  - url: https://api.demo-ecommerce.com
    description: Production environment
  - url: https://api.dev.demo-ecommerce.com
    description: Development environment
  - url: http://localhost:8000
    description: Development environment

tags:
  - name: Authentication
    description: Operations about login and registration
  - name: Products
    description: Operations about products
  - name: Orders
    description: Operations about notification orders
  - name: Carts
    description: Operations about notification carts
  - name: Addresses
    description: Operations about addresses

paths:
  /v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Create a new user account
      operationId: createUser
      requestBody:
        $ref: "#/components/requestBodies/AccountData"
      responses:
        '201':
          description: User created
        '400':
          description: Invalid input
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and get access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated successfully
        '400':
          description: Invalid input
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/products:
    get:
      tags:
        - Products
      summary: List all products with filters
      operationId: findProducts
      security:
        - ClientAuth:
            - read
        - AgentAuth:
            - read:manager
            - read:admin
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get product details by ID
      operationId: getProduct
      security:
        - ClientAuth:
            - read
        - AgentAuth:
            - read:manager
            - read:admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/cart:
    get:
      tags:
        - Carts
      summary: Get current user's cart
      operationId: getCart
      security:
        - ClientAuth:
            - read
        - AgentAuth:
            - read:manager
            - read:admin
      responses:
        '200':
          description: Your cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/cart/items:
    put:
      tags:
        - Carts
      summary: Add item to cart
      operationId: addItem
      security:
        - ClientAuth:
            - write
        - AgentAuth:
            - write:manager
            - write:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
      responses:
        '200':
          description: Item added to cart
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error
    delete:
      tags:
        - Carts
      summary: Delete item to cart
      operationId: deleteItem
      security:
        - ClientAuth:
            - write
        - AgentAuth:
            - write:manager
            - write:admin
      requestBody:
        $ref: "#/components/requestBodies/CartItem"
      responses:
        '200':
          description: Item deleted from cart
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/checkout:
    post:
      tags:
        - Orders
      summary: Checkout and place order
      operationId: checkout
      security:
        - ClientAuth:
            - write
        - AgentAuth:
            - write:manager
            - write:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, payment_method_id]
              properties:
                address_id:
                  type: string
                payment_method_id:
                  type: string
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/orders:
    get:
      tags:
        - Orders
      summary: List your past orders
      operationId: findOrders
      security:
        - ClientAuth:
            - read
        - AgentAuth:
            - read:manager
            - read:admin
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order details
      operationId: getOrder
      security:
        - ClientAuth:
            - read
        - AgentAuth:
            - read:manager
            - read:admin
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error
    delete:
      tags:
        - Orders
      summary: Delete order details
      operationId: deleteOrder
      security:
        - AgentAuth:
            - write:manager
            - write:admin
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

  /v1/addresses:
    get:
      tags:
        - Addresses
      summary: Get your saved addresses
      operationId: getAddress
      security:
        - ClientAuth:
            - read
        - AgentAuth:
            - read:manager
            - read:admin
      responses:
        '200':
          description: List of saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error
    post:
      tags:
        - Addresses
      summary: Add a new address
      operationId: addAddress
      security:
        - ClientAuth:
            - write
        - AgentAuth:
            - write:manager
            - write:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Address added
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error
    patch:
      tags:
        - Addresses
      summary: Update address
      operationId: updateAddress
      security:
        - ClientAuth:
            - write
        - AgentAuth:
            - write:manager
            - write:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Address updated
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error
    delete:
      tags:
        - Addresses
      summary: Delete address
      operationId: deleteAddress
      security:
        - AgentAuth:
            - write:manager
            - write:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Address updated
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: The client does not have access rights
        '414':
          description: request URI too long
        '429':
          description: too many requests
        '500':
          description: internal service error
        '502':
          description: bad gateway
        '512':
          description: internal gateway error

components:
  securitySchemes:
    AgentAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ClientAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      type: apiKey
      in: header
      name: Auth-Token

  requestBodies:
    AccountData:
      description: Account data registration
      required: true
      content:
        application/json:
          schema:
            type: object
            required: 
              - email
              - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              name:
                type: string
    CartItem:
      description: Cart Item data
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartItem'

  schemas:
    Product:
      type: object
      required: [id, name, price, stock, category]
      properties:
        id:
          type: string
          format: uuid
          example: eda5cbc1-a615-4da5-ae73-4a33a9acfb6a
        name:
          type: string
          example: Worry Management
        description:
          type: string
          example: Mr street sell would civil. People through shake southern force.
        price:
          type: number
          format: float
          example: 91.37
        category:
          type: string
          example: wrong
        image_url:
          type: string
          format: uri
          example: https://dummyimage.com/766x809
        stock:
          type: integer
          example: 94
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Address:
      type: object
      required: [line1, city, state, postal_code, country]
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string

    Order:
      type: object
      required: [id, items, total_amount, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total_amount:
          type: number
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered]
        created_at:
          type: string
          format: date-time

    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
